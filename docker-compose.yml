version: '3.8'

services:
  app:
    build: .
    volumes:
      - .:/app
    environment:
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_URI=postgresql://user:password@db:5432/career_guide
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - qdrant
      - db
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    # Script to start ollama and pull the model
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 5 && ollama pull llama3 && wait"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: career_guide
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_storage:
  postgres_data:
  ollama_storage:
